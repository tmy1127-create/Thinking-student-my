<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>分享你的想法</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f7f6; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .card { background: white; padding: 30px 20px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        textarea { width: 100%; height: 120px; padding: 15px; margin-bottom: 20px; border: 2px solid #e0e0e0; border-radius: 12px; resize: none; font-size: 18px; box-sizing: border-box; outline: none; }
        button { background: #4CAF50; color: white; border: none; padding: 16px 20px; font-size: 18px; font-weight: bold; border-radius: 12px; cursor: pointer; width: 100%; touch-action: manipulation; }
        button:active { transform: scale(0.97); } 
        button:disabled { background: #ccc; }
        .footer { margin-top: 30px; font-size: 12px; color: #888; text-align: center; }
        #success-msg { display: none; color: #4CAF50; font-size: 20px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card" id="input-area">
        <h2 style="margin-top:0;">請寫下你的想法</h2>
        <textarea id="stuMsg" placeholder="在這裡輸入 (最多 100 字)..." maxlength="100"></textarea>
        <button id="submitBtn" onclick="sendMessage()">送出</button>
    </div>

    <div class="card" id="success-msg">
        <p>✨ 已收到你的想法！</p>
    </div>

    <div class="footer">
        © 2026 小壁虎老師. All Rights Reserved.
    </div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbyMQQx3nrbTwnPqvvrRioLnL4z8A6B6DSjbbpaqsh9kIdE98yUti3IUd6MmgZSj8H9t/exec';

    function sendMessage() {
        const message = document.getElementById('stuMsg').value.trim();
        if(!message) return;

        const btn = document.getElementById('submitBtn');
        btn.innerText = '傳送中...';
        btn.disabled = true;

        fetch(scriptURL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ message: message })
        })
        .then(() => {
            document.getElementById('input-area').style.display = 'none';
            document.getElementById('success-msg').style.display = 'block';
        })
        .catch(() => {
            alert("傳送失敗，請再試一次");
            btn.disabled = false;
            btn.innerText = '送出';
        });
    }
</script>

</body>
</html>
